<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NK Bot">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>NK Bot – Paper</title>
<style>
:root{--bg:#0b0f14;--card:#141b24;--card2:#1a2330;--tx:#e8eef4;--mu:#8b98a5;--ln:#222c38;--gr:#4ade80;--rd:#f87171;--yl:#fbbf24;--bl:#60a5fa;--nav:rgba(13,18,25,.92)}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--card:#fff;--card2:#eef2f6;--tx:#111827;--mu:#5b6675;--ln:#e3e8ee;--gr:#16a34a;--rd:#dc2626;--yl:#b45309;--bl:#2563eb;--nav:rgba(255,255,255,.94)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
 padding:0 env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-paper{background:rgba(251,191,36,.15);color:var(--yl)}.p-ok{background:rgba(74,222,128,.15);color:var(--gr)}.p-bad{background:rgba(248,113,113,.15);color:var(--rd)}
#stand{padding:0 16px 4px;font-size:12px;color:var(--mu)}
#banner:empty{display:none}#banner{margin:6px 12px 0}
.bn{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:6px}.bn.w{background:rgba(251,191,36,.14);color:var(--yl)}.bn.e{background:rgba(248,113,113,.14);color:var(--rd)}
main{padding:0 12px;max-width:760px;margin:0 auto;contain:content}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}.sub{font-size:14px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.grid b{display:block;font-size:17px}
.mu{color:var(--mu);font-size:13px}.pos{color:var(--gr)}.neg{color:var(--rd)}.warn{color:var(--yl)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln);min-height:44px}
.row:first-of-type{border-top:0}.row .l{min-width:0;flex:1;overflow-wrap:anywhere}.row .r{text-align:right;white-space:nowrap;font-size:14px}
.t{font-size:15px;font-weight:500}.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mu)}
.chip.ok{color:var(--gr)}.chip.bad{color:var(--rd)}.chip.w{color:var(--yl)}.chip.b{color:var(--bl)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-top:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;border-top:0}
td.n,th.n{text-align:right}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%}
.empty{color:var(--mu);font-style:italic;padding:6px 0}
a{color:var(--bl);text-decoration:none}
button.more{display:block;width:100%;min-height:44px;margin-top:8px;border:0;border-radius:12px;background:var(--card2);color:var(--tx);font:inherit;font-size:15px}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500}pre{white-space:pre-wrap;font-size:12px;line-height:1.45;margin:0}
.h3{font-size:14px;font-weight:600;margin:14px 0 2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--nav);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 display:flex;padding:4px max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left));border-top:1px solid var(--ln)}
nav a{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);font-size:10.5px;gap:2px}
nav a span{font-size:20px;line-height:1}nav a.on{color:var(--gr);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}.dot.g{background:var(--gr);box-shadow:0 0 0 4px rgba(74,222,128,.18)}.dot.r{background:var(--rd);box-shadow:0 0 0 4px rgba(248,113,113,.18)}
#sys{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--tx);font:inherit;font-size:13px;padding:6px 0;min-height:44px;cursor:pointer}
.dir{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;letter-spacing:.3px}.dir.L{background:rgba(74,222,128,.16);color:var(--gr)}.dir.S{background:rgba(248,113,113,.16);color:var(--rd)}
.hero .big{font-size:34px}.today{font-size:20px;font-weight:700;margin-top:4px}
.tr{border-top:1px solid var(--ln);padding:12px 0}.tr:first-of-type{border-top:0;padding-top:4px}.tr summary{display:block;list-style:none;min-height:0}.tr summary::-webkit-details-marker{display:none}
.tr .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.tr .sym{font-size:18px;font-weight:700}.tr .rr{font-size:20px;font-weight:700;text-align:right}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.lv div{background:var(--card2);border-radius:10px;padding:6px 8px}.lv span{display:block;font-size:11px;color:var(--mu)}.lv b{font-size:14px}
.det{margin-top:8px;font-size:13px;color:var(--mu);line-height:1.6}.hint{font-size:12px;color:var(--mu);margin-top:6px}
.sk{height:120px;border-radius:16px;background:var(--card);margin:12px 0;opacity:.6}
</style></head><body>
<header><h1>NK Bot</h1><span class="pill p-paper">Übungskonto · keine echten Orders</span></header>
<div id="stand">Lade …</div><div id="banner"></div>
<main id="m"><div class="sk"></div><div class="sk"></div></main>
<nav id="nav"></nav>
<noscript><p style="padding:16px">Bitte JavaScript aktivieren.</p></noscript>
<script>
"use strict";
const TABS=[["dash","🏠","Start"],["sig","⚡","Trades"],["btc","₿","BTC"],["ftmo","🛡️","Risiko"],["strat","🏆","Strategien"],["jr","📒","Journal"],["res","🔬","Research"]];
const NEED={btc:["btc"],dash:["status","signals"],sig:["signals"],jr:["journal"],ftmo:["ftmo"],strat:["strategies"],res:["research"]};
const $=id=>document.getElementById(id);
const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=x=>x===null||x===undefined||x===""||!isFinite(Number(x))?null:Number(x);
const f=(x,d=2)=>{const v=num(x);return v===null?"–":v.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d})};
const usd=(x,d=2)=>num(x)===null?"–":f(x,d)+" $";
const cl=x=>num(x)>0?"pos":num(x)<0?"neg":"";
const TF=new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZoneName:"short"});
const tm=s=>{if(!s)return"–";const d=new Date(String(s).replace(" ","T"));return isNaN(d)?E(s):TF.format(d).replace(",","")};
const ago=s=>{const d=new Date(String(s||"").replace(" ","T"));if(isNaN(d))return null;return(Date.now()-d)/1000};
const dur=sec=>sec==null?"?":sec<90?Math.round(sec)+" s":sec<5400?Math.round(sec/60)+" Min.":sec<172800?f(sec/3600,1)+" Std.":f(sec/86400,1)+" Tage";
const nm=id=>String(id||"").replace(/^PAPER_/,"").replace(/^VERA_/,"").replace(/^GEWINNER_(\d+)_/,"Gewinner $1 · ").replace(/_(Short|Long)(?=_|$)/,"").replace(/_/g," ").replace(/\|/g," · ");
const only=id=>{const m=String(id||"").match(/_(Short|Long)(?=_|$)/);return m?`<span class="chip">nur ${m[1]}-Setups</span>`:""};
const DIR=d=>num(d)>0?'<span class="dir L">▲ LONG</span>':num(d)<0?'<span class="dir S">▼ SHORT</span>':"";
const SYM=s=>String(s||"").replace(".cash","").replace("/","");
const px=(x,ref)=>{const v=num(x);if(v===null)return"–";const a=Math.abs(num(ref)??v);return f(v,a>=1000?2:a>=50?3:5)};
const KIND={OPEN:["eröffnet","b"],NACHGEOEFFNET:["nachgeöffnet","b"],CLOSE:["geschlossen","ok"],VERPASST:["verpasst","w"],NICHT_NACHGEOEFFNET:["nicht nachgeöffnet","w"],BLOCKIERT:["blockiert","bad"]};
const card=(h,b)=>`<section class="card"><h2>${h}</h2>${b}</section>`;
const empty=t=>`<div class="empty">${t}</div>`;
const rows=(a,fn)=>a&&a.length?a.map(fn).join(""):empty("Keine Einträge.");
const row=(l,r)=>`<div class="row"><div class="l">${l}</div><div class="r">${r}</div></div>`;
const tbl=(hd,rs,numc=[])=>rs&&rs.length?`<div class="tw"><table><thead><tr>${hd.map((h,i)=>`<th${numc.includes(i)?' class="n"':""}>${h}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map((x,i)=>`<td${numc.includes(i)?' class="n"':""}>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:empty("Keine Einträge.");
const LIM={};const more=(key,arr,n,fn)=>{const k=LIM[key]||n;return rows(arr.slice(0,k),fn)+(arr.length>k?`<button class="more" data-more="${key}" data-step="${n}">Weitere ${Math.min(n,arr.length-k)} von ${arr.length-k} anzeigen</button>`:"")};

/* ---------- Daten: kleine Dateien, nur bei Bedarf, Fallback auf letzte gespeicherte Daten ---------- */
let META=null,metaFail=null;const DATA={},FROM={};
const ls={get(k){try{return JSON.parse(localStorage.getItem("vera:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("vera:"+k,JSON.stringify(v))}catch(e){}}};
async function getJSON(url){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
 try{const r=await fetch(url,{cache:"no-cache",signal:ctl.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(to)}}
async function loadMeta(){try{META=await getJSON("data/meta.json?t="+Date.now());metaFail=null;ls.set("meta",META)}
 catch(e){metaFail=/^HTTP/.test(e.message)?e.message:"Netzwerkfehler";META=META||ls.get("meta")}}
async function load(name){const sha=META&&META.files&&META.files[name]&&META.files[name].sha;
 if(DATA[name]&&DATA[name].sha===sha&&sha)return DATA[name].d;
 try{const d=await getJSON(`data/${name}.json?v=${sha||Date.now()}`);DATA[name]={d,sha};FROM[name]=null;ls.set("d:"+name,{d,at:META&&META.generated});return d}
 catch(e){const o=ls.get("d:"+name);if(o){FROM[name]=o.at||"?";DATA[name]={d:o.d,sha:null};return o.d}throw e}}

/* ---------- Bausteine ---------- */
const T=p=>{const r=num(p.r_now),tp=(p.tp||[]);return `<details class="tr"><summary><div class="top"><div><span class="sym">${E(SYM(p.symbol))}</span> ${DIR(p.d)}${p.late?' <span class="chip w">nachgeöffnet</span>':""}</div>
 <div class="rr ${cl(r)}">${r===null?"–":(r>0?"+":"")+f(r,2)+" R"}<div class="mu" style="font-weight:400">${num(p.unreal_usd)===null?"":(p.unreal_usd>0?"+":"")+usd(p.unreal_usd)}</div></div></div>
 <div class="lv"><div><span>Einstieg</span><b>${px(p.entry_fill,p.entry_fill)}</b></div><div><span>Stop (SL)</span><b>${px(p.stop,p.entry_fill)}</b></div><div><span>Ziel (TP)</span><b>${tp.length?tp.map(x=>px(x,p.entry_fill)).join(" / "):"–"}</b></div></div></summary>
 <div class="det">Strategie: ${E(nm(p.strategy))}<br>Aktueller Kurs: ${px(p.now_px,p.entry_fill)}<br>Ausstieg: ${E(p.exit_rule||"laut Strategie")}<br>Risiko: ${usd(p.risk_usd)} (${f(p.risk_pct,2)} %) · ${f(p.lots,2)} Lot<br>Signal: ${tm(p.entry_time)} zu ${px(p.signal_entry,p.entry_fill)}
 ${p.late?`<br><b class="warn">${E(p.label||"NACHGEÖFFNET")}</b> – Einstieg zum damals aktuellen Kurs, nicht zum Signalkurs.`:""}</div></details>`};
const EV=a=>{const re=new Set((a||[]).filter(e=>e.kind==="NACHGEOEFFNET").map(e=>e.p&&e.p.key));return(a||[]).filter(e=>KIND[e.kind]&&!(e.kind==="VERPASST"&&e.p&&e.p.key&&re.has(e.p.key)))};
const sn=p=>nm(p.strategy).replace(SYM(p.symbol),"").replace(/\s+/g," ").trim();
const S=e=>{const p=e.p||{},k=KIND[e.kind]||[e.kind,""];
 const r=e.kind==="CLOSE"?`<b class="${cl(p.pnl_usd)}">${(num(p.pnl_usd)>0?"+":"")+usd(p.pnl_usd)}</b><div class="mu">${num(p.r_net)!==null?(p.r_net>0?"+":"")+f(p.r_net,2)+" R":""}</div>`
  :/OPEN|NACHGEOEFFNET/.test(e.kind)?`<span class="mu">bei</span> ${px(p.entry_fill,p.entry_fill)}`:"";
 const why=e.kind==="NACHGEOEFFNET"?`${E(p.label||"")} · Signal ${px(p.signal_entry,p.signal_entry)}`:e.kind==="CLOSE"?E(p.exit_reason||""):E(p.reason||"");
 return row(`<span class="chip ${k[1]}">${k[0]}</span> <span class="mu">${tm(e.ts)}</span><div class="t">${E(SYM(p.symbol))} ${DIR(p.d)} <span class="mu">${E(sn(p))}</span></div>${why?`<div class="mu">${why}</div>`:""}`,r)};

/* ---------- Ansichten ---------- */
const V={
dash(){const s=DATA.status.d,a=s.account||{},g=DATA.signals.d,td=g.today||{};
 const age=ago(s.updated),alive=age!==null&&age<600,feeds=Object.values(s.data||{}),bad=feeds.filter(v=>!v.ok).length;
 const ok=alive&&!bad&&!a.locked&&!s.real_orders_enabled,why=!alive?"Paper-Dienst ohne aktuellen Herzschlag ("+dur(age)+")":a.locked?"FTMO-Sperre":bad?bad+" Datenfeed(s) pausiert":s.real_orders_enabled?"Echte Orders AN":"";
 const htd=num(td.realized)!==null?td.realized+(num(td.unrealized)||0):null,tot=num(a.equity)!==null?a.equity-a.initial:null;
 const op=g.open||[];const ev=EV(g.events).slice(0,6);
 return `<button id="sys" data-tog="sysd" aria-expanded="false"><span class="dot ${ok?"g":"r"}"></span>${ok?"System läuft":E(why)}<span class="mu">· ${tm(s.updated)}</span></button>
 <div id="sysd" hidden>${card("System",row("Paper-Dienst",alive?'<span class="pos">läuft</span>':'<span class="neg">kein Herzschlag</span>')+row("Datenfeeds",`${feeds.length-bad} von ${feeds.length} ok`)
  +row("Strategien aktiv",`${Object.values(s.strategies||{}).filter(v=>/AKTIV/.test(v.state)).length} von ${Object.keys(s.strategies||{}).length}`)+row("Journal",`<span class="mu">${E(s.journal||"–")}</span>`)
  +row("Echte Orders",s.real_orders_enabled?'<b class="neg">AN</b>':'<span class="pos">aus (fest)</span>'))}</div>
 <section class="card hero"><div class="mu">Kontostand (Übungskonto)</div><div class="big">${usd(a.equity)}</div>
  <div class="today ${cl(htd)}">${htd===null?"–":(htd>0?"+":"")+usd(htd)} <span class="mu" style="font-weight:400">heute</span></div>
  <div class="hint">Seit Start ${tot===null?"–":`<span class="${cl(tot)}">${tot>0?"+":""}${usd(tot)}</span>`} · Start ${usd(a.initial,0)}${num(td.unrealized)?` · davon offen ${usd(td.unrealized)}`:""}</div></section>
 ${card(`Offene Trades (${op.length})`,op.length?op.map(T).join("")+'<div class="hint">Antippen für Details.</div>':empty("Gerade kein Trade offen."))}
 ${card("Letzte Signale",ev.length?ev.map(S).join("")+'<a class="more" href="#sig" style="display:flex;align-items:center;justify-content:center">Alle Trades &amp; Signale</a>':empty("Noch keine Signale."))}`},
sig(){const d=DATA.signals.d;
 return card(`Offene Trades (${(d.open||[]).length})`,(d.open||[]).length?d.open.map(T).join(""):empty("Gerade kein Trade offen."))
 +card("Alle Signale & Trades",d.events&&d.events.length?more("sig",EV(d.events),25,S):empty("Noch keine Signale seit Dienststart."))},
btc(){const d=DATA.btc.d,fd=d.feed||{},S2=d.strategies||[];
 const k=r=>r&&r.n!=null?`${f(r.pro_woche,2)}/Woche · ${f(r.trefferquote,1)} % Treffer · Ø ${(r.avg_r>0?"+":"")+f(r.avg_r,3)} R · MaxDD ${f(r.max_dd_r,1)} R`:"–";
 const sr=x=>`<details class="tr"><summary><div class="top"><div><span class="t">${E(x.family)} · ${E(x.tf)}</span> <span class="chip w">−20 % Regeln</span></div><span class="chip ${/AKTIV/.test(x.state||"")?"ok":"w"}">${E(x.state||"–")}</span></div>
  <div class="mu" style="margin-top:4px">Ausstieg: ${x.mgmt==="TP2R"?"Ziel 2R (2:1)":"Trailing-Stop (Struktur)"} · Risiko 0,25 %</div>
  <div class="mu">Test (OOS, gelockert): ${k(x.L20&&x.L20.OOS)}</div></summary>
  <div class="det"><b>Gelockert (L20)</b><br>Lernzeitraum: ${k(x.L20&&x.L20.IS)}<br>Testzeitraum: ${k(x.L20&&x.L20.OOS)}<br><b>Original-Regeln</b><br>Lernzeitraum: ${k(x.ORIG&&x.ORIG.IS)}<br>Testzeitraum: ${k(x.ORIG&&x.ORIG.OOS)}<br><span style="font-size:12px">${E(x.id)}</span></div></details>`;
 return `<section class="card hero"><div class="mu">Bitcoin (BTCUSD)</div><div class="big">${usd(d.price,0)}</div>
  <div class="hint"><span class="dot ${fd.ok?"g":"r"}" style="width:8px;height:8px;box-shadow:none"></span> ${fd.ok?"Kurs live":"Kurs-Feed pausiert"} · ${E(fd.source||"")} · ${tm(d.updated)}</div>
  <div class="bn w" style="margin:10px 0 0">Regeln für BTC um 20 % gelockert – eigene Strategien (NK_BTC_L20), die übrigen Strategien bleiben unverändert. Backtest-Werte sind kein Gewinnversprechen.</div></section>
 ${card(`Offene BTC-Trades (${(d.open||[]).length})`,(d.open||[]).length?d.open.map(T).join(""):empty("Gerade kein BTC-Trade offen."))}
 ${card("Letzte BTC-Signale",EV(d.events).length?more("btc",EV(d.events),10,S):empty("Noch keine BTC-Signale."))}
 ${card(`BTC-Strategien (${S2.length})`,S2.length?S2.map(sr).join("")+'<div class="hint">Antippen für Original vs. gelockert. Kosten: FTMO-Kommission 0,065 % + Spread-Annahme 30 $ (nicht offiziell), Swap.</div>':empty("Keine BTC-Strategien."))}`},
jr(){const ev=DATA.journal.d.events||[];
 return card(`Unveränderliches Journal (Hashkette) · ${ev.length} neueste`,more("jr",ev,40,e=>row(`<span class="chip ${/FEHLER|VERSTOSS|PAUSE/.test(e.kind)?"bad":/CLOSE|OK|START/.test(e.kind)?"ok":""}">${E(e.kind)}</span> <span class="mu">#${e.seq} · ${tm(e.ts)}</span><div class="mu" style="margin-top:3px">${E(e.info)}</div>`,"")))},
ftmo(){const d=DATA.ftmo.d,a=d.account||{},ini=num(a.initial)||100000,rk=d.risk||{};
 const dl=a.equity-a.daily_floor,ml=a.equity-a.max_floor;
 const b=(v,m)=>{const p=Math.max(0,Math.min(100,v/m*100));return`<div class="bar"><i style="width:${isFinite(p)?p:0}%;background:${p<30?"var(--rd)":p<60?"var(--yl)":"var(--gr)"}"></i></div>`};
 const dp=Object.entries(d.daily_pnl||{}).sort().reverse();
 return card(`Risikomanager (virtuell · ${E(d.profile||"–")})`,`<div class="mu">Abstand zur Tagesverlust-Grenze (${usd(a.daily_floor,0)})</div><div class="big ${dl<.015*ini?"warn":""}">${usd(dl)}</div>${b(dl,.05*ini)}
  <div class="mu">Abstand zur Maximalverlust-Grenze (${usd(a.max_floor,0)})</div><div class="big">${usd(ml)}</div>${b(ml,.10*ini)}
  ${row("Risiko je Trade",`${f(rk.default_pct,2)} % / konservativ ${f(rk.conservative_pct,2)} %`)}${row("Offenes Risiko max.",f(rk.max_open_risk_pct,1)+" %")}
  ${a.locked?`<div class="bn e">GESPERRT: ${E(a.locked.rule||JSON.stringify(a.locked))}</div>`:'<div class="pos" style="margin-top:8px">✓ Keine Regelverletzung</div>'}`)
 +card("Tages-P&L (Paper, UTC-Tag)",dp.length?rows(dp,([k,v])=>row(new Date(k+"T12:00:00Z").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}),`<b class="${cl(v)}">${usd(v)}</b>`)):empty("Noch keine abgeschlossenen Paper-Trades."))
 +card("Regelwerke (Quelle)",rows(d.rulesets,r=>row(`<a href="${E(r.url)}" target="_blank" rel="noopener">${E(r.id)}</a>`,`<span class="mu">${E(r.retrieved)}</span>`)))},
strat(){const d=DATA.strategies.d,P=d.paper||[];const g=x=>P.filter(p=>(p.gruppe||"ORB")===x);
 const pr=p=>row(`<div class="t">${E(nm(p.id))} ${only(p.id)}</div><div class="mu">${E(p.herkunft||"")}</div><div class="mu">${E(p.basis||"")}</div>`,`${E(p.symbol)}<div class="mu">${f(p.risk_pct,2)} %</div><span class="chip ${p.gruppe==="GEWINNER"?"w":"ok"}">${E(p.status||"Paper")}</span>`);
 const R=r=>[E(nm(r.strategy)),E(r.symbol)+(r.tf?" "+E(r.tf):""),f(r.n,0),`<span class="${cl(r.avg_r)}">${f(r.avg_r,3)}</span>`,f(r.pf,2),f(r.t,2)];
 return card(`Im Paper-Trading: ORB (${g("ORB").length})`,rows(g("ORB"),pr))
 +card(`Im Paper-Trading: Gewinner (${g("GEWINNER").length})`,rows(g("GEWINNER"),pr)+'<div class="bn w" style="margin-top:8px">Data-Mining-Treffer: kleine Holdout-Stichproben, Rückblick-Werte sind kein Gewinnversprechen.</div>')
 +card("Robuste ORB-Konfigurationen (Phase 1, OOS)",tbl(["Strategie","Symbol","n","ØR","PF","t"],(d.robust_orb||[]).map(R),[2,3,4,5]))
 +card("Rangliste ORB OOS netto (n≥30)"+(d.orb_run?` · ${E(d.orb_run)}`:""),tbl(["Strategie","Symbol","n","ØR","PF","t"],(d.orb||[]).map(R),[2,3,4,5]))
 +card("Rangliste VERA-Familien OOS netto (n≥30)"+(d.vera_run?` · ${E(d.vera_run)}`:""),tbl(["Familie · Einstieg","Symbol","n","ØR","PF","t"],(d.vera||[]).map(R),[2,3,4,5])+'<div class="mu" style="margin-top:8px">Viele Kombinationen getestet → Spitzenwerte teils Zufall. Keine Familie besteht Walk-Forward.</div>')},
res(){const d=DATA.research.d;
 const lk=(u,t)=>u?`<a href="${E(u)}" target="_blank" rel="noopener">${E(t||u)}</a>`:E(t||"–");
 return card(`Hypothesen (${(d.hypotheses||[]).length})`,(d.hypotheses||[]).length?more("hy",d.hypotheses,15,h=>row(`<div class="t">${lk(h.url,h.title)}</div><div class="mu">${E(h.source)} · ${E(h.family)}</div>`,`<span class="chip">${E(h.status)}</span>`)):empty("Noch keine Hypothesen."))
 +card(`Funde (${(d.candidates||[]).length})`,more("ca",d.candidates||[],15,c=>row(`<div class="t">${lk(c.url,(c.title||"").slice(0,90))}</div><div class="mu">${E(c.found||"")}</div>`,`<span class="chip">${E(c.stage)}</span>`)))
 +card("Offene Fragen an Nico",d.fragen_md?`<details><summary>Fragenliste anzeigen</summary><pre>${E(d.fragen_md)}</pre></details>`:empty("Noch keine Fragenliste."))}};

/* ---------- Rendern: nur wenn sich etwas geändert hat ---------- */
let cur=null,lastHTML="",busy=false;
function nav(k){$("nav").innerHTML=TABS.map(([t,i,l])=>`<a href="#${t}" class="${t===k?"on":""}"${t===k?' aria-current="page"':""}><span aria-hidden="true">${i}</span>${l}</a>`).join("")}
function banners(){const b=[];
 if(metaFail)b.push(`<div class="bn e">Keine Verbindung zu GitHub Pages (${E(metaFail)}). Angezeigt werden die letzten Daten von ${META?E(META.stand)+" MEZ":"–"}.</div>`);
 if(META){const ea=ago(META.generated);if(ea>900)b.push(`<div class="bn w">Letzter Export vor ${dur(ea)} (${E(META.stand)} MEZ) – der Export auf der Box lief seitdem nicht. Werte können veraltet sein.</div>`);
  const er=Object.keys(META.errors||{});if(er.length)b.push(`<div class="bn w">Beim letzten Export fehlten: ${E(er.join(", "))} – dafür letzte gültige Daten.</div>`)}
 const fr=Object.entries(FROM).filter(([,v])=>v);if(fr.length&&!metaFail)b.push(`<div class="bn w">Datei nicht ladbar – zeige letzte Daten von ${E(tm(fr[0][1]))}.</div>`);
 const h=b.join("");if($("banner").innerHTML!==h)$("banner").innerHTML=h;
 const st=META?`Stand ${E(META.stand)} MEZ · Update alle ${META.interval_min||5} Min.`:"Keine Daten";if($("stand").textContent!==st)$("stand").textContent=st}
async function show(force){const k=(location.hash||"#dash").slice(1);const key=V[k]?k:"dash";
 if(busy)return;busy=true;try{
  if(key!==cur){nav(key);cur=key;lastHTML="";window.scrollTo(0,0)}
  if(force||!META)await loadMeta();
  let html;try{await Promise.all(NEED[key].map(load));html=V[key]()}
  catch(e){html=card("Daten nicht verfügbar",`<div class="neg">${E(e.message||e)}</div><div class="mu">Es liegen auch keine zwischengespeicherten Daten vor.</div><button class="more" data-reload="1">Erneut versuchen</button>`)}
  banners();if(html!==lastHTML){const op=[...document.querySelectorAll("#m details")].map(d=>d.open),sh=$("sysd")&&!$("sysd").hidden;$("m").innerHTML=html;lastHTML=html;
   document.querySelectorAll("#m details").forEach((d,i)=>{if(op[i])d.open=true});if(sh&&$("sysd")){$("sysd").hidden=false;$("sys").setAttribute("aria-expanded","true")}}
 }finally{busy=false}}
document.addEventListener("click",e=>{const tg=e.target.closest("[data-tog]");if(tg){const x=$(tg.dataset.tog);x.hidden=!x.hidden;tg.setAttribute("aria-expanded",String(!x.hidden));return}
 const m=e.target.closest("[data-more]");if(m){LIM[m.dataset.more]=(LIM[m.dataset.more]||+m.dataset.step)+ +m.dataset.step;lastHTML="";const y=scrollY;show().then(()=>scrollTo(0,y));return}
 if(e.target.closest("[data-reload]"))show(true)},{passive:true});
addEventListener("hashchange",()=>show(false),{passive:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)show(true)},{passive:true});
addEventListener("online",()=>show(true),{passive:true});
setInterval(()=>{if(!document.hidden)show(true)},60000);
show(true);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
